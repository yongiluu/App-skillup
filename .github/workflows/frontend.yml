name: frontend

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  pruebas:
    name: frontend-pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      # Las pruebas usan los datos simulados: no necesitan la API ni ninguna clave.
      - name: Pruebas
        run: npm test
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Compilar
        run: npm run build
